</head><body><div class="wrap">

<img class="ban" src="assets/banner.jpg" alt="ระบบบันทึกพฤติกรรมการมาสาย นักเรียนโรงเรียนบุ่งคล้านคร" width="1300" height="433">
<div id="v"></div>
</div>
<script src="assets/cc.js?v=1.06.0.131126"></script>
<script>
/* หน้าครู (หน้าหลัก) — ล็อกอินด้วยบัญชีเว็บส่งงาน · หัก/เพิ่มคะแนนทีละหลายคน · คะแนนห้องที่ปรึกษา (เมื่อเปิดสิทธิ์)
   ประหยัด: เปิดหน้า = staffMe 1 ครั้ง (สิทธิ์ + รายการของวันนี้) + roster (ส่งเฉพาะเมื่อรายชื่อเปลี่ยน) · ไม่มีการโหลดซ้ำอัตโนมัติ */
(function(){
const {$,esc,toast,api,store,IC}=CC;
let staff=store.get("staff"),ME=null,CFG=null,R=[],MINE=[],tab=store.get("tab")==="sc"?"sc":"adj",picker=null; // 1.05.1: จำแท็บไว้
let A={sign:-1,item:null,custom:false,late:false,cl:"",cp:"",note:""},busy=false,PH=[],EVC={}; // 1.05.0: PH = รูปหลักฐานที่รอส่ง · EVC = รูปที่โหลดแล้ว
let SC={room:"",list:null,period:"",q:"",key:"",st:null};
CC.chrome("หน้าครู","บันทึกคะแนนพฤติกรรม");
CC.setErr(e=>{if(e.code==="staff")out(e.message)});
const linksHtml=`<div class="links"><a href="council.html">${IC.group} หน้าสภานักเรียน</a><a href="student.html">${IC.stu} หน้านักเรียน</a></div>`;

function loginView(msg){
  $("#v").innerHTML=`<form class="card lgx" id="lg" style="text-align:center;padding:18px 14px"><img src="icons/icon-192.png" alt="" width="72" height="72" style="border-radius:16px"><div style="font-weight:800;font-size:18px;margin:8px 0 2px">เข้าสู่ระบบสำหรับครู</div><div class="mut" style="margin-bottom:8px">ใช้ชื่อผู้ใช้และรหัสผ่านเดียวกับเว็บส่งงาน BNK Academic Hub</div>
  <input id="u" placeholder="ชื่อผู้ใช้" autocomplete="username" required><label class="pw"><input id="p" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" required><button type="button" class="eye" id="eye" aria-label="แสดงรหัสผ่าน" title="แสดงรหัสผ่าน">${eyeSvg(false)}</button></label><button class="btn">เข้าสู่ระบบ</button><div class="red" id="lgm" style="margin-top:8px">${esc(msg||"")}</div></form>
  <div class="mut center" style="margin:12px 0 6px">ไปหน้าอื่น</div>${linksHtml}`;
}
function out(msg){staff="";ME=null;store.set("staff","");store.set("av","");loginView(msg)}
function eyeSvg(on){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'+(on?'<path d="M4 20 20 4"/>':'')+'</svg>'}
// 1.05.1: รูปโปรไฟล์จากเว็บส่งงาน (จำไว้ในเครื่อง — เว็บส่งงานไม่ตอบก็ยังแสดงรูปเดิม) · ไม่มีรูป = ตัวอักษรแรกของชื่อ
function picHtml(){if(ME&&typeof ME.avatar==="string")store.set("av",ME.avatar);const u=store.get("av")||"",n=String((ME&&ME.name)||"").replace(CC.PRE,"").replace(/^(ครู|อ\.|ดร\.)\s*/,"").charAt(0);return u?`<img class="pic" src="${esc(u)}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=&quot;pic&quot;>${esc(n)}</span>'">`:`<span class="pic">${esc(n)}</span>`}
async function login(){
  const b=$("#lg button");b.disabled=true;$("#lgm").textContent="";
  try{const d=await api("staffLogin",{username:$("#u").value.trim(),password:$("#p").value});staff=d.staffToken;store.set("staff",staff);ME=d.me;CFG=d.settings;MINE=[];await loadRoster();fetchMine();render()}
  catch(e){const m=$("#lgm");if(m){m.textContent=e.message;b.disabled=false}}
}
async function fetchMine(){try{const d=await api("mine",{staffToken:staff});MINE=d.mine;paintMine()}catch(e){}}
async function loadRoster(){const r=await CC.roster({staffToken:staff});R=r.rooms}
async function start(){
  if(!staff){loginView();return}
  $("#v").innerHTML='<div class="card mut">กำลังโหลด…</div>';
  try{
    const d=await api("staffMe",{staffToken:staff});if(d.staffToken){staff=d.staffToken;store.set("staff",staff)}
    ME=d.me;CFG=d.settings;MINE=d.mine||[];await loadRoster();render();
  }catch(e){if(e.code==="staff")return;$("#v").innerHTML=`<div class="card"><div class="mut">${esc(e.message)}</div><button class="btn" id="retry" style="margin-top:8px">ลองใหม่</button></div>`}
}
const care=()=>ME&&ME.kind==="care";
const scoreRooms=()=>care()?R.map(r=>({id:r.id,name:r.name})):(CFG.advisorView?ME.rooms:[]);
function render(){
  const sr=scoreRooms(),tabs=sr.length?`<div class="tabs"><button id="tA" class="${tab==="adj"?"on":""}">หัก / เพิ่มคะแนน</button><button id="tS" class="${tab==="sc"?"on":""}">${care()?"ดูคะแนน":"คะแนนห้อง "+esc(sr.map(r=>r.name).join(", "))}</button></div>`:"";
  if(!sr.length)tab="adj";
  $("#v").innerHTML=`${linksHtml}<div class="me">${picHtml()}<div class="nm"><b>${esc(ME.name)}</b><span class="role${care()?" care":""}">${care()?"ครูกิจการนักเรียน":"ครู"}</span></div><button type="button" class="out" id="sout" title="ออกจากระบบ">${IC.out}<span>ออก</span></button></div>${tabs}<div id="pane"></div>`;
  tab==="adj"?adjView():scoreView();
}
// ---------- หัก / เพิ่มคะแนน ----------
function adjView(){
  $("#pane").innerHTML='<div id="pk"></div><div class="card" id="mine"></div>';
  picker=CC.Picker($("#pk"),{rooms:R,title:"รายชื่อที่เลือก",onChange:paintAct});
  paintAct();paintMine();
}
function curItem(){if(A.late)return{late:true,label:"มาสาย",delta:-(CFG.latePoints||0)||-0.0001};if(A.custom)return{label:A.cl.trim(),delta:A.sign*Math.abs(Math.trunc(+A.cp||0))};return A.item==null?null:CFG.items.find(x=>x.i===A.item)}
function paintAct(){
  const box=picker&&picker.actions();if(!box)return;
  const its=CFG.items.filter(x=>(x.delta>0)===(A.sign>0)),n=picker.sel().length,it=curItem(),cls=A.sign>0?"p":"m";
  box.innerHTML=`<div class="sw"><button type="button" class="m${A.sign<0?" on":""}" data-sg="-1">− หักคะแนน</button><button type="button" class="p${A.sign>0?" on":""}" data-sg="1">+ เพิ่มคะแนน</button></div>
  <div class="items">${A.sign<0?`<button type="button" class="lt${A.late?" on":""}" data-lt>⏰ มาสาย${CFG.latePoints?" −"+CFG.latePoints:""}</button>`:""}${its.map(x=>`<button type="button" class="${cls}${!A.custom&&!A.late&&A.item===x.i?" on":""}" data-it="${x.i}">${esc(x.label)} ${x.delta>0?"+":""}${x.delta}</button>`).join("")}${CFG.custom?`<button type="button" class="${cls}${A.custom?" on":""}" data-cus>อื่นๆ (พิมพ์เอง)</button>`:""}</div>
  ${!its.length&&!CFG.custom?`<div class="empty">ยังไม่มีรายการ${A.sign>0?"เพิ่ม":"หัก"}คะแนนที่ใช้ได้</div>`:""}
  ${A.custom?`<div class="cus"><input id="cl" placeholder="เรื่อง" maxlength="60" value="${esc(A.cl)}"><input id="cp" type="number" inputmode="numeric" min="1" max="100" placeholder="คะแนน" value="${esc(A.cp)}"></div>`:""}
  <input id="nt" class="fld" placeholder="หมายเหตุ (ถ้ามี)" maxlength="200" value="${esc(A.note)}">
  ${CFG.ev&&!A.late?phHtml():""}
  <button type="button" class="btn blk" id="save"${!n||!it||!it.label||!it.delta||busy?" disabled":""}>${saveTxt(it,n)}</button>`;
}
// ---------- 1.05.0: รูปหลักฐาน (ย่อในเครื่อง → Worker → Google Drive) ----------
const MAXP=()=>CFG.maxPhotos||5;
function phHtml(){return `<div class="phs"><div class="phl">📷 รูปหลักฐาน <span class="mut">(ถ้ามี · ไม่เกิน ${MAXP()} รูป)</span></div><div class="pht">${PH.map((p,i)=>`<span class="ph"><img src="${p.url}" alt=""><button type="button" data-phx="${i}" aria-label="เอารูปออก">✕</button></span>`).join("")}${PH.length<MAXP()?`<label class="phadd">＋<span>ถ่าย/เลือกรูป</span><input type="file" id="phin" accept="image/*" multiple hidden></label>`:""}</div><div class="mut" style="font-size:12px">ย่อรูปอัตโนมัติก่อนส่ง · เห็นเฉพาะครูกิจการนักเรียน ผู้บันทึก และผู้ดูแล</div></div>`}
function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const M=1280,r=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.82,d=c.toDataURL("image/jpeg",q);while(d.length>420000&&q>.4){q-=.12;d=c.toDataURL("image/jpeg",q)}ok(d)};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("เปิดรูปไม่ได้"))};im.src=u})}
async function addPhotos(files){for(const f of [...files]){if(PH.length>=MAXP()){toast("แนบได้ไม่เกิน "+MAXP()+" รูป");break}if(!/^image\//.test(f.type))continue;try{const d=await shrink(f);PH.push({url:d})}catch(e){toast(e.message)}}paintAct()}
async function upPhotos(ids,list){let ok=0;for(let i=0;i<list.length;i++){toast("กำลังอัปรูปหลักฐาน "+(i+1)+"/"+list.length+"…");try{await api("evup",{staffToken:staff,ids,base64:list[i].url.split(",")[1],mime:"image/jpeg"});ok++}catch(e){toast("อัปรูปไม่สำเร็จ: "+e.message)}}return ok}
async function evShow(eventId,pids,box){box.innerHTML=pids.map((p,i)=>`<span class="evt" data-evi="${i}">${EVC[p]?`<img src="${EVC[p]}" alt="">`:'<span class="mut">กำลังโหลด…</span>'}</span>`).join("");for(let i=0;i<pids.length;i++){const p=pids[i];if(!EVC[p]){try{const d=await api("evget",{staffToken:staff,eventId,pid:p});EVC[p]="data:"+d.mime+";base64,"+d.base64}catch(e){const s=box.querySelector(`[data-evi="${i}"]`);if(s)s.innerHTML='<span class="red" style="font-size:12px">'+esc(e.message)+'</span>';continue}}const s=box.querySelector(`[data-evi="${i}"]`);if(s)s.innerHTML=`<img src="${EVC[p]}" alt="">`}}
function zoom(src){const z=document.createElement("div");z.className="zoom";z.innerHTML=`<img src="${src}" alt=""><button type="button" aria-label="ปิด">✕</button>`;z.addEventListener("click",()=>z.remove());document.body.appendChild(z)}
function phBadge(id,pids){return pids&&pids.length?` <button type="button" class="phb" data-ev="${id}" data-p="${esc(pids.join(","))}">📷 ${pids.length}</button>`:""}
function saveTxt(it,n){return busy?"กำลังบันทึก…":it&&it.late?"บันทึกมาสาย "+n+" คน":it&&it.delta?`บันทึก ${it.delta>0?"+":""}${it.delta} ให้ ${n} คน`:"เลือกรายการ"}
function paintMine(){
  const b=$("#mine");if(!b)return;
  b.innerHTML=`<div class="hd"><span>ที่ฉันบันทึกวันนี้ (${MINE.length})</span></div>`+(MINE.length?MINE.map(x=>x.late?`<div class="hi"><span class="pt t">${esc(x.time||"")}</span><span class="grow">${esc(x.name)} <span class="mut">· ${esc(x.room)} เลขที่ ${esc(x.no)}</span><small>มาสาย${x.note?" · "+esc(x.note):""}</small></span><button type="button" class="x" data-unl="${esc(x.key)}">ลบ</button></div>`:`<div class="hi"><span class="pt ${x.delta>0?"p":""}">${x.delta>0?"+":""}${x.delta}</span><span class="grow">${esc(x.name)} <span class="mut">· ${esc(x.room)} เลขที่ ${esc(x.no)}</span><small>${esc(x.item)}${x.note?" · "+esc(x.note):""}${phBadge(x.id,x.ph)}</small><span class="evs" id="evs${x.id}"></span></span>${CFG.ev&&(x.ph||[]).length<MAXP()?`<label class="x phup" title="แนบรูปหลักฐาน">📷+<input type="file" accept="image/*" hidden data-phup="${x.id}"></label>`:""}<button type="button" class="x" data-un="${x.id}">ยกเลิก</button></div>`).join(""):'<div class="empty">ยังไม่มีรายการ</div>');
}
async function save(){
  const sel=picker.sel(),it=curItem();if(!sel.length||!it||busy)return;
  busy=true;paintAct();
  try{
    if(it.late){const d=await api("late",{staffToken:staff,keys:sel.map(s=>s.key),note:A.note});MINE=d.mine;toast("บันทึกมาสาย "+d.added+" คน"+(d.skipped?" (สายแล้ววันนี้ "+d.skipped+" คน)":""));A.note="";picker.clear();paintMine();return}
    const p={staffToken:staff,keys:sel.map(s=>s.key),note:A.note};
    if(A.custom)p.custom={label:it.label,delta:it.delta};else{p.item=it.i;p.label=it.label}
    const d=await api("adjust",p);MINE=d.mine;
    if(PH.length&&d.ids&&d.ids.length){const n=await upPhotos(d.ids,PH);PH=[];try{MINE=(await api("mine",{staffToken:staff})).mine}catch(e){}toast(`บันทึก ${d.delta>0?"+":""}${d.delta} (${d.item}) ให้ ${d.n} คนแล้ว · แนบรูป ${n} รูป`)}
    else toast(`บันทึก ${d.delta>0?"+":""}${d.delta} (${d.item}) ให้ ${d.n} คนแล้ว`);
    A.note="";picker.clear();paintMine();
  }catch(e){toast(e.message)}finally{busy=false;paintAct()}
}
async function unadjust(id,btn){
  if(!(await CC.ask("ยกเลิกรายการนี้?","","ยกเลิกรายการ",{cancel:"ไม่ใช่"})))return;btn.disabled=true;
  try{const d=await api("unadjust",{staffToken:staff,id});MINE=d.mine;paintMine();if(SC.key)openStudent(SC.key);toast("ยกเลิกแล้ว")}catch(e){toast(e.message);btn.disabled=false}
}
async function unlate(key,btn){
  if(!(await CC.ask("ลบรายการมาสายนี้?","","ลบ")))return;btn.disabled=true;
  try{const d=await api("unlate",{staffToken:staff,key});MINE=d.mine;paintMine();toast("ลบแล้ว")}catch(e){toast(e.message);btn.disabled=false}
}
// ---------- คะแนน ----------
function lvTxt(l){return l==="good"?"ดี":l==="fair"?"พอใช้":"ต้องปรับปรุง"}
function scoreView(){
  const rooms=scoreRooms();if(!SC.room||!rooms.some(r=>r.id===SC.room))SC.room=rooms[0].id;
  if(SC.key){
    const d=SC.st;if(!d){$("#pane").innerHTML='<div class="card mut">กำลังโหลด…</div>';return}
    const sp=d.startPoints||100;
    $("#pane").innerHTML=`<button class="back" id="sback">‹ กลับไปรายชื่อ</button><div class="card"><div class="st1">${CC.ring(d.score,sp)}<div><b style="font-size:17px">${esc(d.student.name)}</b><div class="mut" style="margin:2px 0 6px">${esc(d.student.room)} เลขที่ ${esc(d.student.no)} · มาสาย ${d.late} ครั้ง</div><span class="lvp lv-${d.level}">ระดับ ${lvTxt(d.level)}</span></div></div>${care()?`<button type="button" class="btn blk rpt" id="rpt">📄 รายงาน PDF (แนบบันทึก / ทัณฑ์บน)</button>`:""}</div>
    <div class="card"><b>ประวัติ</b> <span class="mut">(${esc(d.period||"")})</span><div style="margin-top:6px">${d.hist.length?d.hist.map(x=>x.kind==="late"?`<div class="hi"><span class="pt">${x.delta||0}</span><span class="grow">มาสาย ${esc(x.time||"")}${x.reason?" ("+esc(x.reason)+")":""}<small>${CC.thD(x.date)} · บันทึกโดย ${esc(x.by||"-")}</small></span></div>`
      :`<div class="hi"><span class="pt ${x.delta>0?"p":""}">${x.delta>0?"+":""}${x.delta}</span><span class="grow">${esc(x.item)}${x.note?` <span class="mut">· ${esc(x.note)}</span>`:""}<small>${CC.thD(x.date)} · โดย ${esc(x.by||"-")}${phBadge(x.id,x.photos)}</small><span class="evs" id="evs${x.id}"></span></span>${care()||MINE.some(m=>m.id===x.id)?`<button type="button" class="x" data-un="${x.id}">ยกเลิก</button>`:""}</div>`).join(""):'<div class="mut">ยังไม่มีรายการ</div>'}</div></div>`;
    return;
  }
  const L=(SC.list||[]).filter(([k,n,m])=>!SC.q||CC.hit(m,SC.q)||n===SC.q);
  $("#pane").innerHTML=`<div class="flt"><select id="scr" aria-label="เลือกห้อง">${rooms.map(r=>`<option value="${esc(r.id)}"${r.id===SC.room?" selected":""}>${esc(r.name)}</option>`).join("")}</select><input id="scq" type="search" placeholder="ค้นหาชื่อหรือเลขที่" value="${esc(SC.q)}"></div>
  <div class="card">${SC.list&&SC.period?`<div class="mut" style="margin-bottom:6px">นับคะแนน: ${esc(SC.period)}</div>`:""}${!SC.list?'<div class="mut">กำลังโหลด…</div>':L.map(([k,n,m,sc,lv,late])=>`<button class="srow" data-k="${esc(k)}"><span class="no">${esc(n)}</span><span class="nm">${esc(m)}${late?` <span class="mut">· สาย ${late}</span>`:""}</span><span class="sc lv-${lv}">${sc}</span></button>`).join("")||'<div class="mut">ไม่พบรายชื่อ</div>'}</div>`;
  if(!SC.list)loadScores();
}
async function loadScores(){const r=SC.room;try{const d=await api("scores",{staffToken:staff,roomId:r});if(r!==SC.room)return;SC.list=d.list;SC.period=d.period;if(tab==="sc"&&!SC.key)scoreView()}catch(e){toast(e.message)}}
async function openStudent(k){SC.key=k;SC.st=null;scoreView();try{SC.st=await api("student",{staffToken:staff,key:k});if(SC.key===k&&tab==="sc")scoreView()}catch(e){toast(e.message);SC.key="";scoreView()}}

// 1.05.1: กด Back ตอนดูนักเรียนรายคน = กลับรายชื่อ · เลือกนักเรียนไว้แต่ยังไม่บันทึก = ถามก่อนออก
CC.back.sub(()=>!!ME&&tab==="sc"&&!!SC.key&&!!$("#sback"),()=>{const b=$("#sback");if(b)b.click()});
CC.back.dirty(()=>{const n=ME&&tab==="adj"&&picker&&$("#pk")&&picker.sel().length;return n?"เลือกนักเรียนไว้ "+n+" คน ยังไม่ได้บันทึก ออกจากหน้านี้เลยไหม?":""});
document.addEventListener("submit",e=>{if(e.target.id==="lg"){e.preventDefault();login()}});
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.id==="retry"){start();return}
  if(t.closest("#sout")){CC.ask("ออกจากระบบ?","ครั้งหน้าต้องเข้าสู่ระบบด้วยบัญชีเว็บส่งงานอีกครั้ง","ออกจากระบบ",{icon:IC.out}).then(ok=>{if(ok)out("")});return}
  const ey=t.closest("#eye");if(ey){const p=$("#p"),on=p.type==="password";p.type=on?"text":"password";ey.classList.toggle("on",on);ey.innerHTML=eyeSvg(on);ey.setAttribute("aria-label",on?"ซ่อนรหัสผ่าน":"แสดงรหัสผ่าน");ey.title=ey.getAttribute("aria-label");return}
  if(t.closest("#tA")){tab="adj";store.set("tab",tab);render();return}
  if(t.closest("#tS")){if(picker&&picker.sel().length){CC.ask("ยังไม่ได้บันทึก","เลือกนักเรียนไว้ "+picker.sel().length+" คน ยังไม่ได้บันทึก ไปหน้าดูคะแนนเลยไหม?","ไปเลย").then(ok=>{if(ok){picker.clear();tab="sc";store.set("tab",tab);SC.key="";SC.list=null;render()}});return}tab="sc";store.set("tab",tab);SC.key="";SC.list=null;render();return}
  const sg=t.closest("[data-sg]");if(sg){A.sign=+sg.dataset.sg;A.item=null;A.custom=false;A.late=false;paintAct();return}
  if(t.closest("[data-lt]")){A.late=true;A.item=null;A.custom=false;paintAct();return}
  const it=t.closest("[data-it]");if(it){A.item=+it.dataset.it;A.custom=false;A.late=false;paintAct();return}
  if(t.closest("[data-cus]")){A.custom=true;A.late=false;A.item=null;paintAct();const c=$("#cl");if(c)c.focus();return}
  if(t.closest("#save")){save();return}
  const px=t.closest("[data-phx]");if(px){PH.splice(+px.dataset.phx,1);paintAct();return}
  const pb=t.closest("[data-ev]");if(pb){const box=$("#evs"+pb.dataset.ev);if(box){if(box.innerHTML){box.innerHTML="";return}evShow(+pb.dataset.ev,pb.dataset.p.split(","),box)}return}
  const zi=t.closest(".evt img");if(zi){zoom(zi.src);return}
  if(t.closest("#rpt")){report();return}
  const un=t.closest("[data-un]");if(un){unadjust(+un.dataset.un,un);return}
  const ul=t.closest("[data-unl]");if(ul){unlate(ul.dataset.unl,ul);return}
  const sr=t.closest(".srow");if(sr){openStudent(sr.dataset.k);return}
  if(t.closest("#sback")){SC.key="";SC.st=null;SC.list=null;scoreView();return}
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="nt")A.note=e.target.value;
  else if(id==="cl"||id==="cp"){A[id]=e.target.value;const b=$("#save"),it=curItem(),n=picker?picker.sel().length:0;if(b){b.disabled=!n||!it.label||!it.delta||busy;b.textContent=it.delta?`บันทึก ${it.delta>0?"+":""}${it.delta} ให้ ${n} คน`:"ใส่คะแนน"}}
  else if(id==="scq"){SC.q=e.target.value.trim();clearTimeout(SC.h);SC.h=setTimeout(()=>{scoreView();const i=$("#scq");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},200)}
});
document.addEventListener("change",async e=>{
  if(e.target.id==="scr"){SC.room=e.target.value;SC.list=null;scoreView();return}
  if(e.target.id==="phin"){await addPhotos(e.target.files);return}
  const u=e.target.dataset&&e.target.dataset.phup;if(u&&e.target.files.length){const f=[];for(const x of [...e.target.files].slice(0,1)){try{f.push({url:await shrink(x)})}catch(er){toast(er.message)}}if(f.length){const n=await upPhotos([+u],f);if(n)toast("แนบรูปแล้ว");try{MINE=(await api("mine",{staffToken:staff})).mine;paintMine()}catch(er){}}}
});
// ---------- 1.05.0: รายงาน PDF รายบุคคล (ครูกิจการนักเรียน) ----------
function loadJs(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("โหลดไลบรารีไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต"));document.head.appendChild(s)})}
async function report(){
  const d=SC.st;if(!d)return;
  if(!window.CareReport)await loadJs("assets/carereport.js?v="+CC.VERSION);
  CareReport.open({data:d,school:"โรงเรียนบุ่งคล้านคร",fileName:"รายงานพฤติกรรม_"+String(d.student.room).replace("ม.","ม").replace("/","-")+"_"+d.student.no+"_"+String(d.student.name).replace(/\s+/g,"_")+".pdf",
    load:async()=>{if(!window.html2canvas)await loadJs("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");if(!window.jspdf)await loadJs("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");return{h2c:window.html2canvas,jsPDF:window.jspdf.jsPDF}},
    getPhoto:async(eventId,pid)=>{if(!EVC[pid]){const r=await api("evget",{staffToken:staff,eventId,pid});EVC[pid]="data:"+r.mime+";base64,"+r.base64}return EVC[pid]}});
}
start();
})();
