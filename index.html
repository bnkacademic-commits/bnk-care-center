<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BNK Care Center</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#667085;--ln:#e3e6ec;--pri:#c8102e;--prib:#fdeaea;--acc:#ffc928;--navy:#2b1a6e;--red:#c62828;--redb:#fde8e8;--grn:#1b7a3d;--grnb:#e3f5ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e232c;--tx:#eceff4;--mut:#9aa4b5;--ln:#2e3542;--pri:#ff6b6b;--prib:#3d2220;--acc:#ffc928;--navy:#b9a8ff;--red:#ff8a80;--redb:#42221f;--grn:#6fd49a;--grnb:#1c3a29;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e232c;--tx:#eceff4;--mut:#9aa4b5;--ln:#2e3542;--pri:#ff6b6b;--prib:#3d2220;--acc:#ffc928;--navy:#b9a8ff;--red:#ff8a80;--redb:#42221f;--grn:#6fd49a;--grnb:#1c3a29;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Sarabun,"Noto Sans Thai",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;padding:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
select,input{font:inherit;padding:9px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);min-width:0}
.bar select,.bar input{flex:1}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.cnt{font-weight:600}.mut{color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ln);padding:6px 0}.row:last-child{border:0}
.row .main{flex:1;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:6px 0;min-width:0}
.no{width:28px;color:var(--mut);text-align:right;flex:none}.nm{flex:1;overflow-wrap:anywhere}
.chip{font-size:13px;padding:3px 9px;border-radius:99px;background:var(--grnb);color:var(--grn);flex:none}
.ban{display:block;width:100%;border-radius:14px;margin-bottom:8px}.stl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}.stl .sub{margin:0}
.tabs button.on{background:var(--pri);border-color:var(--pri);box-shadow:inset 0 -3px 0 var(--acc)}
details.p{border-bottom:1px solid var(--ln);padding:6px 0}details.p:last-child{border:0}details.p summary{display:flex;gap:8px;align-items:center;cursor:pointer;list-style:none}details.p summary::-webkit-details-marker{display:none}.p .ds{margin:4px 0 2px 8px;font-size:13px;color:var(--mut)}
.late .chip{background:var(--redb);color:var(--red)}.late .nm{font-weight:600}
.row select{padding:5px;font-size:14px;flex:none;max-width:110px}
.bars .b{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}.b span:first-child{width:52px;flex:none}
.b i{display:block;height:14px;background:var(--pri);border-radius:4px;min-width:2px}.b .t{flex:1}
.red{color:var(--red);font-weight:600}.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:#fff;font:inherit;font-weight:600}
#st{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--grnb);color:var(--grn)}#st.off{background:var(--redb);color:var(--red)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:9px 14px;border-radius:10px;display:none;font-size:14px}
.login{display:flex;flex-direction:column;gap:10px}.login .btn:disabled,.btn:disabled{opacity:.6}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mut);font-size:12px;padding:4px 2px 14px}
.link{background:none;border:0;color:var(--mut);font:inherit;text-decoration:underline;padding:8px 0;flex:none}

/* 1.01.0: รหัส PIN · แท็บคะแนนพฤติกรรม */
.tabs button{display:flex;align-items:center;justify-content:center;gap:6px}.tabs .ic{font-size:13px}
.pin{text-align:center;padding:20px 14px}.pin b.t{font-size:18px}
.dots{display:flex;gap:9px;justify-content:center;margin:14px 0 16px}.dots i{width:40px;height:48px;border:2px solid var(--ln);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-style:normal}
.dots i.f{border-color:var(--pri)}.dots i.f::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--tx)}.dots i.x{opacity:.45;border-style:dashed}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:290px;margin:0 auto}.kp button{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:13px 0;font:inherit;font-size:22px;color:var(--tx)}
.kp button.ok{background:var(--pri);border-color:var(--pri);color:#fff;font-size:17px;font-weight:700}.kp button.dl{font-size:16px;color:var(--mut)}.kp button:disabled{opacity:.45}
.lgx input{width:100%;margin:6px 0}.lgx .btn{width:100%;margin-top:6px}
.who{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);padding:0 2px 8px}
.srow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 4px;border:0;border-top:1px solid var(--ln);background:none;color:var(--tx);font:inherit;text-align:left}.srow:first-child{border-top:0}
.srow .no{width:28px;color:var(--mut);text-align:right;flex:none}.srow .nm{flex:1}.srow .sc{font-weight:800;min-width:46px;text-align:center;border-radius:8px;padding:2px 6px}
.lv-good{background:var(--grnb);color:var(--grn)}.lv-fair{background:#fff4d6;color:#9a6700}.lv-low{background:var(--redb);color:var(--red)}
.st1{display:flex;gap:14px;align-items:center}
.ring{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ring div{width:70px;height:70px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}.ring b{font-size:25px}.ring small{font-size:11px;color:var(--mut)}
.lvp{display:inline-block;font-weight:700;font-size:12px;border-radius:99px;padding:2px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.b2{border-radius:12px;padding:11px;text-align:center;font:inherit;font-weight:700;border:1px solid}.b2.m{background:var(--redb);color:var(--red);border-color:var(--redb)}.b2.p{background:var(--grnb);color:var(--grn);border-color:var(--grnb)}
.hi{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--ln);font-size:14px}.hi:first-child{border-top:0}
.pt{flex:none;width:44px;text-align:center;font-weight:800;border-radius:8px;padding:2px 0}.pt.m{background:var(--redb);color:var(--red)}.pt.p{background:var(--grnb);color:var(--grn)}
.hi small{display:block;color:var(--mut);font-size:12px}.hi .x{margin-left:auto;background:none;border:0;color:var(--red);font:inherit;font-size:13px;text-decoration:underline;padding:2px 0;flex:none}
.items{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.items button{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 12px;font:inherit;font-size:14px}.items button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.adj input{width:100%;margin:5px 0}.adj .row2{display:flex;gap:8px}.adj .row2 input{flex:1}
.back{background:none;border:0;color:var(--pri);font:inherit;font-weight:600;padding:4px 0 8px}
</style></head><body><div class="wrap">

<script>

function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2500)}
function status(ok,msg){const s=$("#st");s.className=ok?"":"off";s.textContent=msg}
async function api(action,data){
  const c=new AbortController(),to=setTimeout(()=>c.abort(),15000);
  let res;
  try{res=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,token,staffToken:staff,...data}),signal:c.signal})}
  catch(e){const x=new Error("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้");x.net=true;throw x}
  finally{clearTimeout(to)}
  let d;try{d=await res.json()}catch(e){throw new Error("เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง")}
  if(d.status!=="success"){if(d.code==="auth")logout(token?"รหัส PIN ถูกเปลี่ยน กรุณาใส่รหัสใหม่":"");else if(d.code==="nopin")noPin(d.message);else if(d.code==="staff")staffOut(d.message);const x=new Error(d.message||"เกิดข้อผิดพลาด");x.code=d.code;throw x}
  return d;
}
async function listAll(from,to){let all=[],offset=0,d;do{d=await api("list",{from,to,offset});all=all.concat(d.records);offset+=d.records.length}while(d.more);return all}

function loginView(msg){

  pinPaint();
}

function selectFocused(){const a=document.activeElement;return !!a&&a.tagName==="SELECT"&&$("#v").contains(a)}

async function loadDay(){
  const s=++daySeq,m=mutSeq,d=date;lastLoad=Date.now();
  try{
    const rows=await listAll(d,d);
    if(s!==daySeq||m!==mutSeq||d!==date||busy.size)return;
    const n={};rows.forEach(r=>n[r.key]=r);
    const changed=dayLoading||JSON.stringify(n)!==JSON.stringify(recs);
    recs=n;dayLoading=false;status(true,"ออนไลน์");
    if(changed||dirty)refresh();
  }catch(e){if(token&&e.net)status(false,"เชื่อมต่อไม่ได้ กำลังลองใหม่…");else if(token)status(false,"โหลดข้อมูลไม่สำเร็จ")}
}
function rangeStart(){
  const now=new Date(),t=dstr(now);
  if(range==="today")return t;
  if(range==="week"){const d=new Date(now);d.setDate(d.getDate()-((d.getDay()+6)%7));return dstr(d)}
  if(range==="month")return t.slice(0,8)+"01";
  return "0000-01-01";
}
async function loadSum(){
  const s=++sumSeq;
  try{
    const rows=await listAll(rangeStart(),dstr(new Date()));
    if(s!==sumSeq)return;
    const changed=sumLoading||JSON.stringify(rows)!==JSON.stringify(sumRecs);
    sumRecs=rows;sumLoading=false;status(true,"ออนไลน์");
    if(view===2&&(changed||dirty))refresh();
  }catch(e){if(token&&s===sumSeq){status(false,e.net?"เชื่อมต่อไม่ได้ กำลังลองใหม่…":"โหลดข้อมูลไม่สำเร็จ");if(sumLoading){sumLoading=false;if(view===2)refresh()}}}
}
function openSum(){sumLoading=true;render();loadSum()}
function touch(){lastUse=Date.now();if(!paused)return;paused=false;if(token&&R.length){status(true,"ออนไลน์");if(view===1&&!document.hidden)loadDay()}}
function tick(){

async function toggle(key){
  if(!rec.trim()){toast("กรุณากรอกชื่อผู้บันทึกก่อน");const i=$("#rc");if(i)i.focus();return}
  if(busy.has(key))return;
  const d=date,old=recs[key],g=R.find(r=>r.id===room),s=g.students.find(x=>x[0]===key);
  mutSeq++;busy.add(key);
  if(old)delete recs[key];else{const n=new Date();recs[key]={date:d,key,roomId:room,room:g.name,no:s[1],name:s[2],time:pad(n.getHours())+":"+pad(n.getMinutes()),reason:"",by:rec.trim()}}
  render();
  try{
    if(old)await api("unmark",{date:d,key});
    else{const r=await api("mark",{date:d,key,by:rec.trim()});if(d===date)recs[key]=r.record}
  }catch(e){
    if(d===date){if(old)recs[key]=old;else delete recs[key]}
    if(token)toast(e.message||"บันทึกไม่สำเร็จ");
  }finally{busy.delete(key);mutSeq++;if(token&&R.length)refresh()}
}
async function setReason(key,v){
  const r=recs[key];if(!r)return;
  const d=date,old=r.reason;r.reason=v;mutSeq++;busy.add(key);
  try{await api("reason",{date:d,key,reason:v})}
  catch(e){if(recs[key]===r&&d===date)r.reason=old;if(token){toast("บันทึกสาเหตุไม่สำเร็จ");dirty=true}}
  finally{busy.delete(key);mutSeq++}
  if(dirty&&token&&R.length){const a=document.activeElement;if(a)a.blur();render()}
}

  const L=(SC.list||[]).filter(([k,n,m])=>!SC.q||m.includes(SC.q)||n===SC.q);
  return who+`<div class="bar"><select id="scr" aria-label="เลือกห้อง">${R.map(r=>`<option value="${esc(r.id)}"${r.id===SC.room?" selected":""}>${esc(r.name)}</option>`).join("")}</select><input id="scq" placeholder="ค้นหาชื่อหรือเลขที่" value="${esc(SC.q)}"></div>
  <div class="card">${SC.list&&SC.period?`<div class="mut" style="font-size:13px;margin-bottom:6px">นับคะแนน: ${esc(SC.period)}</div>`:""}${!SC.list?'<div class="mut">กำลังโหลด…</div>':L.map(([k,n,m,sc,lv,late])=>`<button class="srow" data-k="${esc(k)}"><span class="no">${esc(n)}</span><span class="nm">${esc(m)}${late?` <span class="mut">· สาย ${late}</span>`:""}</span><span class="sc lv-${lv}">${sc}</span></button>`).join("")||'<div class="mut">ไม่พบรายชื่อ</div>'}</div>`;
}
function render(){
  if(!R.length&&view!==3)return;
  dirty=false;
  const a=document.activeElement,kid=a&&(a.id==="q"||a.id==="sq"||a.id==="rc"||a.id==="scq"||a.id==="adjI")?a.id:null,keep=kid?a.selectionStart:null;
  const open=[...document.querySelectorAll("details.p[open] .nm")].map(e=>e.textContent);
  $("#v").innerHTML=view===1?recView():view===2?sumView():scoreView();
  if(open.length)document.querySelectorAll("details.p").forEach(d=>{const n=d.querySelector(".nm");if(n&&open.includes(n.textContent))d.open=true});
  $("#t1").className=view===1?"on":"";$("#t2").className=view===2?"on":"";$("#t3").className=view===3?"on":"";$("#t3i").innerHTML=staff?I_STAR:I_LOCK;
  if(kid){const i=$("#"+kid);if(i){i.focus();i.setSelectionRange(keep,keep)}}
}
document.addEventListener("submit",e=>{if(e.target.id==="slg"){e.preventDefault();staffLogin()}else if(e.target.id==="adjF"){e.preventDefault();adjSave()}});
document.addEventListener("click",e=>{
  if(e.target.id==="retry"){start();return}
  const pk=e.target.closest("[data-pn]");if(pk){pinKey(pk.dataset.pn);return}
  if(e.target.closest("#sout")){staffOut("");return}
  const sr=e.target.closest(".srow");if(sr){openStudent(sr.dataset.k);return}
  if(e.target.closest("#sback")){SC.key="";SC.st=null;SC.adj=null;render();return}
  const ab=e.target.closest("[data-adj]");if(ab){SC.adj={sign:ab.dataset.adj==="p"?1:-1,item:"",pts:"",note:""};render();return}
  if(e.target.closest("#adjX")){SC.adj=null;render();return}
  const it=e.target.closest("[data-it]");if(it&&SC.adj){const x=SC.cfg.items[+it.dataset.it];SC.adj.item=x.label;SC.adj.pts=String(Math.abs(x.delta));render();return}
  const ux=e.target.closest("[data-un]");if(ux){unadjust(+ux.dataset.un,ux);return}
  const b=e.target.closest(".main");
  if(b){toggle(b.dataset.k);return}
  if(e.target.id==="csv")csv();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="rm"){room=t.value;q="";render()}
  else if(t.id==="dt"){if(t.value&&t.value<=today&&t.value!==date){date=t.value;recs={};dayLoading=true;render();loadDay()}else render()}
  else if(t.id==="rg"){range=t.value;openSum()}
  else if(t.id==="sr"){sroom=t.value;render()}
  else if(t.id==="scr"){SC.room=t.value;SC.list=null;SC.q="";render();loadScores()}
  else if(t.tagName==="SELECT"&&t.dataset.k){setReason(t.dataset.k,t.value);t.blur()}
});
document.addEventListener("input",e=>{if(e.target.id==="sq"){sq=e.target.value.trim();render();return}if(e.target.id==="rc"){rec=e.target.value;store.set("recorder",rec);return}if(e.target.id==="q"){q=e.target.value.trim();render();return}if(e.target.id==="scq"){SC.q=e.target.value.trim();render();return}if(SC.adj&&["adjI","adjP","adjN"].includes(e.target.id)){const k={adjI:"item",adjP:"pts",adjN:"note"}[e.target.id];SC.adj[k]=e.target.value}});
$("#t1").onclick=()=>{view=1;render();loadDay()};$("#t2").onclick=()=>{view=2;openSum()};$("#t3").onclick=()=>{view=3;render();if(staff&&!SC.list)loadScores()};
setInterval(tick,POLL_MS);
document.addEventListener("visibilitychange",onVisible);
document.addEventListener("pointerdown",touch,true);document.addEventListener("keydown",touch,true);
start(); // 1.01.0: ครูปิด PIN ได้ — ถามเซิร์ฟเวอร์ก่อนว่าต้องใช้ PIN ไหม
console.log("BNK Care Center "+VERSION);
</script></body></html>
