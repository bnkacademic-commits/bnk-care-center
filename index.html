<!DOCTYPE html>
<html lang="th" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BNK Care Center — หน้าครู</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#c8102e">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Care ครู">
<script>try{if(localStorage.getItem("bnkcc_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/cc.css?v=1.02.0.091126">
</head><body><div class="wrap">
<div class="top" id="top"></div>
<img class="ban" src="assets/banner.jpg" alt="ระบบบันทึกพฤติกรรมการมาสาย นักเรียนโรงเรียนบุ่งคล้านคร" width="1300" height="433">
<div id="v"></div>
</div>
<script src="assets/cc.js?v=1.02.0.091126"></script>
<script>
/* หน้าครู (หน้าหลัก) — ล็อกอินด้วยบัญชีเว็บส่งงาน · หัก/เพิ่มคะแนนทีละหลายคน · คะแนนห้องที่ปรึกษา (เมื่อเปิดสิทธิ์)
   ประหยัด: เปิดหน้า = staffMe 1 ครั้ง (สิทธิ์ + รายการของวันนี้) + roster (ส่งเฉพาะเมื่อรายชื่อเปลี่ยน) · ไม่มีการโหลดซ้ำอัตโนมัติ */
(function(){
const {$,esc,toast,api,store,IC}=CC;
let staff=store.get("staff"),ME=null,CFG=null,R=[],MINE=[],tab="adj",picker=null;
let A={sign:-1,item:null,custom:false,cl:"",cp:"",note:""},busy=false;
let SC={room:"",list:null,period:"",q:"",key:"",st:null};
CC.chrome("หน้าครู","บันทึกคะแนนพฤติกรรม");
CC.setErr(e=>{if(e.code==="staff")out(e.message)});
const linksHtml=`<div class="links"><a href="council.html">${IC.group} หน้าสภานักเรียน</a><a href="student.html">${IC.stu} หน้านักเรียน</a></div>`;

function loginView(msg){
  $("#v").innerHTML=`<form class="card lgx" id="lg" style="text-align:center;padding:18px 14px"><img src="icons/icon-192.png" alt="" width="72" height="72" style="border-radius:16px"><div style="font-weight:800;font-size:18px;margin:8px 0 2px">เข้าสู่ระบบสำหรับครู</div><div class="mut" style="margin-bottom:8px">ใช้ชื่อผู้ใช้และรหัสผ่านเดียวกับเว็บส่งงาน BNK Academic Hub</div>
  <input id="u" placeholder="ชื่อผู้ใช้" autocomplete="username" required><input id="p" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" required><button class="btn">เข้าสู่ระบบ</button><div class="red" id="lgm" style="margin-top:8px">${esc(msg||"")}</div></form>
  <div class="mut center" style="margin:12px 0 6px">ไปหน้าอื่น</div>${linksHtml}`;
}
function out(msg){staff="";ME=null;store.set("staff","");loginView(msg)}
async function login(){
  const b=$("#lg button");b.disabled=true;$("#lgm").textContent="";
  try{const d=await api("staffLogin",{username:$("#u").value.trim(),password:$("#p").value});staff=d.staffToken;store.set("staff",staff);ME=d.me;CFG=d.settings;MINE=[];await loadRoster();fetchMine();render()}
  catch(e){const m=$("#lgm");if(m){m.textContent=e.message;b.disabled=false}}
}
async function fetchMine(){try{const d=await api("mine",{staffToken:staff});MINE=d.mine;paintMine()}catch(e){}}
async function loadRoster(){const r=await CC.roster({staffToken:staff});R=r.rooms}
async function start(){
  if(!staff){loginView();return}
  $("#v").innerHTML='<div class="card mut">กำลังโหลด…</div>';
  try{
    const d=await api("staffMe",{staffToken:staff});if(d.staffToken){staff=d.staffToken;store.set("staff",staff)}
    ME=d.me;CFG=d.settings;MINE=d.mine||[];await loadRoster();render();
  }catch(e){if(e.code==="staff")return;$("#v").innerHTML=`<div class="card"><div class="mut">${esc(e.message)}</div><button class="btn" id="retry" style="margin-top:8px">ลองใหม่</button></div>`}
}
const care=()=>ME&&ME.kind==="care";
const scoreRooms=()=>care()?R.map(r=>({id:r.id,name:r.name})):(CFG.advisorView?ME.rooms:[]);
function render(){
  const sr=scoreRooms(),tabs=sr.length?`<div class="tabs"><button id="tA" class="${tab==="adj"?"on":""}">หัก / เพิ่มคะแนน</button><button id="tS" class="${tab==="sc"?"on":""}">${care()?"ดูคะแนน":"คะแนนห้อง "+esc(sr.map(r=>r.name).join(", "))}</button></div>`:"";
  if(!sr.length)tab="adj";
  $("#v").innerHTML=`<div class="who"><span><b>${esc(ME.name)}</b><span class="role${care()?" care":""}">${care()?"ครูกิจการนักเรียน":"ครู"}</span></span><button class="link" id="sout">ออกจากระบบ</button></div>${linksHtml}${tabs}<div id="pane"></div>`;
  tab==="adj"?adjView():scoreView();
}
// ---------- หัก / เพิ่มคะแนน ----------
function adjView(){
  $("#pane").innerHTML='<div id="pk"></div><div class="card" id="mine"></div>';
  picker=CC.Picker($("#pk"),{rooms:R,title:"รายชื่อที่เลือก",onChange:paintAct});
  paintAct();paintMine();
}
function curItem(){if(A.custom)return{label:A.cl.trim(),delta:A.sign*Math.abs(Math.trunc(+A.cp||0))};return A.item==null?null:CFG.items.find(x=>x.i===A.item)}
function paintAct(){
  const box=picker&&picker.actions();if(!box)return;
  const its=CFG.items.filter(x=>(x.delta>0)===(A.sign>0)),n=picker.sel().length,it=curItem(),cls=A.sign>0?"p":"m";
  box.innerHTML=`<div class="sw"><button type="button" class="m${A.sign<0?" on":""}" data-sg="-1">− หักคะแนน</button><button type="button" class="p${A.sign>0?" on":""}" data-sg="1">+ เพิ่มคะแนน</button></div>
  <div class="items">${its.map(x=>`<button type="button" class="${cls}${!A.custom&&A.item===x.i?" on":""}" data-it="${x.i}">${esc(x.label)} ${x.delta>0?"+":""}${x.delta}</button>`).join("")}${CFG.custom?`<button type="button" class="${cls}${A.custom?" on":""}" data-cus>อื่นๆ (พิมพ์เอง)</button>`:""}</div>
  ${!its.length&&!CFG.custom?`<div class="empty">ยังไม่มีรายการ${A.sign>0?"เพิ่ม":"หัก"}คะแนนที่ใช้ได้</div>`:""}
  ${A.custom?`<div class="cus"><input id="cl" placeholder="เรื่อง" maxlength="60" value="${esc(A.cl)}"><input id="cp" type="number" inputmode="numeric" min="1" max="100" placeholder="คะแนน" value="${esc(A.cp)}"></div>`:""}
  <input id="nt" class="fld" placeholder="หมายเหตุ (ถ้ามี)" maxlength="200" value="${esc(A.note)}">
  <button type="button" class="btn blk" id="save"${!n||!it||!it.label||!it.delta||busy?" disabled":""}>${busy?"กำลังบันทึก…":it&&it.delta?`บันทึก ${it.delta>0?"+":""}${it.delta} ให้ ${n} คน`:"เลือกรายการ"}</button>`;
}
function paintMine(){
  const b=$("#mine");if(!b)return;
  b.innerHTML=`<div class="hd"><span>ที่ฉันบันทึกวันนี้ (${MINE.length})</span></div>`+(MINE.length?MINE.map(x=>`<div class="hi"><span class="pt ${x.delta>0?"p":""}">${x.delta>0?"+":""}${x.delta}</span><span class="grow">${esc(x.name)} <span class="mut">· ${esc(x.room)} เลขที่ ${esc(x.no)}</span><small>${esc(x.item)}${x.note?" · "+esc(x.note):""}</small></span><button type="button" class="x" data-un="${x.id}">ยกเลิก</button></div>`).join(""):'<div class="empty">ยังไม่มีรายการ</div>');
}
async function save(){
  const sel=picker.sel(),it=curItem();if(!sel.length||!it||busy)return;
  busy=true;paintAct();
  try{
    const p={staffToken:staff,keys:sel.map(s=>s.key),note:A.note};
    if(A.custom)p.custom={label:it.label,delta:it.delta};else{p.item=it.i;p.label=it.label}
    const d=await api("adjust",p);MINE=d.mine;toast(`บันทึก ${d.delta>0?"+":""}${d.delta} (${d.item}) ให้ ${d.n} คนแล้ว`);
    A.note="";picker.clear();paintMine();
  }catch(e){toast(e.message)}finally{busy=false;paintAct()}
}
async function unadjust(id,btn){
  if(!confirm("ยกเลิกรายการนี้?"))return;btn.disabled=true;
  try{const d=await api("unadjust",{staffToken:staff,id});MINE=d.mine;paintMine();if(SC.key)openStudent(SC.key);toast("ยกเลิกแล้ว")}catch(e){toast(e.message);btn.disabled=false}
}
// ---------- คะแนน ----------
function lvTxt(l){return l==="good"?"ดี":l==="fair"?"พอใช้":"ต้องปรับปรุง"}
function scoreView(){
  const rooms=scoreRooms();if(!SC.room||!rooms.some(r=>r.id===SC.room))SC.room=rooms[0].id;
  if(SC.key){
    const d=SC.st;if(!d){$("#pane").innerHTML='<div class="card mut">กำลังโหลด…</div>';return}
    const sp=d.startPoints||100,pc=Math.max(0,Math.min(100,d.score/sp*100)),col=d.level==="good"?"var(--grn)":d.level==="fair"?"#d4a017":"var(--red)";
    $("#pane").innerHTML=`<button class="back" id="sback">‹ กลับไปรายชื่อ</button><div class="card"><div class="st1"><div class="ring" style="background:conic-gradient(${col} 0 ${pc}%,var(--ln) ${pc}% 100%)"><div><b>${d.score}</b><small>จาก ${sp}</small></div></div><div><b style="font-size:17px">${esc(d.student.name)}</b><div class="mut" style="margin:2px 0 6px">${esc(d.student.room)} เลขที่ ${esc(d.student.no)} · มาสาย ${d.late} ครั้ง</div><span class="lvp lv-${d.level}">ระดับ ${lvTxt(d.level)}</span></div></div></div>
    <div class="card"><b>ประวัติ</b> <span class="mut">(${esc(d.period||"")})</span><div style="margin-top:6px">${d.hist.length?d.hist.map(x=>x.kind==="late"?`<div class="hi"><span class="pt">${x.delta||0}</span><span class="grow">มาสาย ${esc(x.time||"")}${x.reason?" ("+esc(x.reason)+")":""}<small>${CC.thD(x.date)} · บันทึกโดย ${esc(x.by||"-")}</small></span></div>`
      :`<div class="hi"><span class="pt ${x.delta>0?"p":""}">${x.delta>0?"+":""}${x.delta}</span><span class="grow">${esc(x.item)}${x.note?` <span class="mut">· ${esc(x.note)}</span>`:""}<small>${CC.thD(x.date)} · โดย ${esc(x.by||"-")}</small></span>${care()||MINE.some(m=>m.id===x.id)?`<button type="button" class="x" data-un="${x.id}">ยกเลิก</button>`:""}</div>`).join(""):'<div class="mut">ยังไม่มีรายการ</div>'}</div></div>`;
    return;
  }
  const L=(SC.list||[]).filter(([k,n,m])=>!SC.q||CC.hit(m,SC.q)||n===SC.q);
  $("#pane").innerHTML=`<div class="flt"><select id="scr" aria-label="เลือกห้อง">${rooms.map(r=>`<option value="${esc(r.id)}"${r.id===SC.room?" selected":""}>${esc(r.name)}</option>`).join("")}</select><input id="scq" type="search" placeholder="ค้นหาชื่อหรือเลขที่" value="${esc(SC.q)}"></div>
  <div class="card">${SC.list&&SC.period?`<div class="mut" style="margin-bottom:6px">นับคะแนน: ${esc(SC.period)}</div>`:""}${!SC.list?'<div class="mut">กำลังโหลด…</div>':L.map(([k,n,m,sc,lv,late])=>`<button class="srow" data-k="${esc(k)}"><span class="no">${esc(n)}</span><span class="nm">${esc(m)}${late?` <span class="mut">· สาย ${late}</span>`:""}</span><span class="sc lv-${lv}">${sc}</span></button>`).join("")||'<div class="mut">ไม่พบรายชื่อ</div>'}</div>`;
  if(!SC.list)loadScores();
}
async function loadScores(){const r=SC.room;try{const d=await api("scores",{staffToken:staff,roomId:r});if(r!==SC.room)return;SC.list=d.list;SC.period=d.period;if(tab==="sc"&&!SC.key)scoreView()}catch(e){toast(e.message)}}
async function openStudent(k){SC.key=k;SC.st=null;scoreView();try{SC.st=await api("student",{staffToken:staff,key:k});if(SC.key===k&&tab==="sc")scoreView()}catch(e){toast(e.message);SC.key="";scoreView()}}

document.addEventListener("submit",e=>{if(e.target.id==="lg"){e.preventDefault();login()}});
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.id==="retry"){start();return}
  if(t.closest("#sout")){if(confirm("ออกจากระบบ?"))out("");return}
  if(t.closest("#tA")){tab="adj";render();return}
  if(t.closest("#tS")){tab="sc";SC.key="";SC.list=null;render();return}
  const sg=t.closest("[data-sg]");if(sg){A.sign=+sg.dataset.sg;A.item=null;A.custom=false;paintAct();return}
  const it=t.closest("[data-it]");if(it){A.item=+it.dataset.it;A.custom=false;paintAct();return}
  if(t.closest("[data-cus]")){A.custom=true;A.item=null;paintAct();const c=$("#cl");if(c)c.focus();return}
  if(t.closest("#save")){save();return}
  const un=t.closest("[data-un]");if(un){unadjust(+un.dataset.un,un);return}
  const sr=t.closest(".srow");if(sr){openStudent(sr.dataset.k);return}
  if(t.closest("#sback")){SC.key="";SC.st=null;SC.list=null;scoreView();return}
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="nt")A.note=e.target.value;
  else if(id==="cl"||id==="cp"){A[id]=e.target.value;const b=$("#save"),it=curItem(),n=picker?picker.sel().length:0;if(b){b.disabled=!n||!it.label||!it.delta||busy;b.textContent=it.delta?`บันทึก ${it.delta>0?"+":""}${it.delta} ให้ ${n} คน`:"ใส่คะแนน"}}
  else if(id==="scq"){SC.q=e.target.value.trim();clearTimeout(SC.h);SC.h=setTimeout(()=>{scoreView();const i=$("#scq");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},200)}
});
document.addEventListener("change",e=>{if(e.target.id==="scr"){SC.room=e.target.value;SC.list=null;scoreView()}});
start();
})();
</script>
</body></html>
